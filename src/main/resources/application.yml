spring:
  application:
    name: tupi-digital-api

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # O escopo padrão já é profile e email, mas você pode declarar explicitamente se quiser:
            # scope: profile, email

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # As requested, we use flyway, so we only validate JPA mapping
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    username: ${MAIL_USERNAME:}
    
brevo:
  api:
    key: ${BREVO_API_KEY:}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 # 24 hours in milliseconds
