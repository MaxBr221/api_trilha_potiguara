spring:
  application:
    name: tupi-digital-api
  main:
    allow-circular-references: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # O escopo padrão já é profile e email, mas você pode declarar explicitamente se quiser:
            # scope: profile, email

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 6
      minimum-idle: 2
      idle-timeout: 60000
      max-lifetime: 180000
      connection-timeout: 5000
      keepalive-time: 30000
      leak-detection-threshold: 3000

  jpa:
    hibernate:
      ddl-auto: validate # As requested, we use flyway, so we only validate JPA mapping
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    username: ${MAIL_USERNAME:}
    
brevo:
  api:
    key: ${BREVO_API_KEY:}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: 14400000 # 4 hours in milliseconds

gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    key: ${GEMINI_API_KEY:}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}

